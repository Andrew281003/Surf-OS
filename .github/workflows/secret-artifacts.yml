name: Secret artifact guard
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked files
        run: python scripts/check-secret-artifacts.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish desktop
        run: dotnet publish src/SurfOS.Console/SurfOS.csproj -c Release -o dist/surfos
      - name: Scan release output
        run: python scripts/check-secret-artifacts.py dist/surfos
